server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    location /health/live {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # 两类请求的 body 上限都要考虑，取更宽松的那个：
        # 1) 对象存储直传 PUT（/api/v1/storage/objects/{token}）≈ 文件原体积；
        # 2) 自动解析评分项的 POST：文件 base64 进 JSON 体，膨胀约 4/3，
        #    5 MiB 文件 => 约 7 MB。
        # 因此这里取 8m，保证应用层的 5 MiB 校验（UPLOAD_INVALID）能真正生效，
        # 而不是请求先被 nginx 以 413 拦掉。
        client_max_body_size 8m;
    }

    location /health/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
