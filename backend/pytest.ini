[pytest]
testpaths = tests
pythonpath = .
# 单元/集成/契约测试统一从 backend 根目录执行:
#   ..\.venv\Scripts\python.exe -m pytest -q
#
# --basetemp 显式落在项目内（该目录已被 .gitignore 的 .pytest_cache/ 覆盖）：
# 默认的 %TEMP%\pytest-of-<user> 在部分受限环境（沙箱、只读临时目录）无法创建，
# 会让所有使用 tmp_path 的集成测试在 setup 阶段直接报 PermissionError。
addopts = -q --strict-markers --basetemp=.pytest_cache/tmp

# 集成/契约测试需要真实 PostgreSQL（独立测试库 + Alembic 迁移建表，见 tests/pg_support.py）。
# TEST_DATABASE_URL 与 DATABASE_URL 均无有效配置或实例不可达时，相关用例自动 skip。
#
# asyncio_mode=auto：并发注册等用例需要 async 夹具与 async 测试，统一自动识别。
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 单个测试的最大运行时长（秒），超时自动取消（pytest-timeout）。
# 覆盖方式（优先级从高到低）：
#   1. 单个用例标记  @pytest.mark.timeout(30)
#   2. 命令行        --timeout 60
#   3. 环境变量      TEST_TIMEOUT_SECONDS=60（项目解析，非法值配置错误退出）
#   4. 环境变量      PYTEST_TIMEOUT=60
#   5. 此处默认值    120
# 超时时会把事件与全部线程栈写入 backend/test-reports/timeout-events.log（见 conftest.py）。
# 注意：Windows 上超时以 thread 方法终止整个 pytest 进程，fixture 清理不保证执行。
timeout = 120
